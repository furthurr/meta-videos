<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Meta AI (mock video ready)</title></head>
  <body>
    <div id="app">
      <main>
        <div class="conversation">
          <div class="message assistant">
            <div class="media-result">
              <video
                id="result-video"
                src="https://video.xx.fbcdn.net/o1/v/t2/f2/m69/sample_meta_video.mp4"
                controls
              ></video>
            </div>
          </div>
        </div>
        <div class="composer">
          <textarea placeholder="Ask Meta AI anything" aria-label="Message Meta AI"></textarea>
          <button aria-label="Send" type="submit">Send</button>
        </div>
      </main>
    </div>
  </body>
</html>
